name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-store:
    name: Test store app
    runs-on: ubuntu-24.04
    # UBUNTU 25.04 (plucky) is used as build env because the repo's Qt6
    # plugins need Qt >= 6.5; Ubuntu 24.04 only ships Qt 6.4 and has no
    # KDE6 (libplasma-dev, libkf6windowsystem-dev) packages at all.
    container: ubuntu:25.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make cmake g++ qt6-base-dev qt6-base-dev-tools
      - name: Configure
        run: cmake -S . -B build/dev -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/dev -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build/dev --output-on-failure

  test-plugin:
    name: Test KDE plugin
    runs-on: ubuntu-24.04
    container: ubuntu:25.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make cmake g++ extra-cmake-modules \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            qt6-tools-dev qt6-tools-dev-tools \
            libkf6windowsystem-dev kwayland-dev \
            libplasma-dev
      - name: Configure
        run: cmake -S plugin -B build/plugin \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/plugin -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build/plugin --output-on-failure

  release:
    name: Build .deb packages and publish
    needs: [test-store, test-plugin]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    container: ubuntu:25.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make cmake g++ extra-cmake-modules fakeroot dpkg-dev \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            qt6-tools-dev qt6-tools-dev-tools \
            libkf6windowsystem-dev kwayland-dev \
            libplasma-dev
      - name: Generate Firebase config from secrets
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_DATABASE_ID: ${{ secrets.FIREBASE_DATABASE_ID }}
        run: |
          if [ -n "${FIREBASE_API_KEY}" ] && [ -n "${FIREBASE_PROJECT_ID}" ]; then
            cat > resources/config/config.env <<EOF
            FIREBASE_API_KEY=${FIREBASE_API_KEY}
            FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
            FIREBASE_DATABASE_ID=${FIREBASE_DATABASE_ID}
            EOF
            echo "Generated resources/config/config.env from GitHub secrets"
          else
            echo "No FIREBASE_* secrets set; keeping placeholder config.env"
          fi
      - name: Build .deb packages
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          ./packaging/deb/build-deb.sh "$VERSION"
      - name: Upload packages to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packaging/deb/dist/*.deb
          generate_release_notes: true